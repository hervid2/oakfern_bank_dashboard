# pnpm settings for the Oakfern repository (pnpm 11 reads these from here, not .npmrc).

# allowBuilds is pnpm 11's install-script allowlist (pnpm 10 called it
# onlyBuiltDependencies). Prisma needs it to place its query engine binaries;
# nothing else in the tree may run lifecycle scripts.
allowBuilds:
  '@prisma/engines': true
  prisma: true

# next@16.4.6 and its platform packages are newer than pnpm 11's default
# minimumReleaseAge gate. They are the ADR-0002 pins, verified on the npm
# registry 2026-11-09 (plan.md §7.1).
minimumReleaseAgeExclude:
  - '@next/env@16.4.6'
  - '@next/eslint-plugin-next@16.4.6'
  - '@next/swc-darwin-arm64@16.4.6'
  - '@next/swc-darwin-x64@16.4.6'
  - '@next/swc-linux-arm64-gnu@16.4.6'
  - '@next/swc-linux-arm64-musl@16.4.6'
  - '@next/swc-linux-x64-gnu@16.4.6'
  - '@next/swc-linux-x64-musl@16.4.6'
  - '@next/swc-win32-arm64-msvc@16.4.6'
  - '@next/swc-win32-x64-msvc@16.4.6'
  - eslint-config-next@16.4.6
  - next@16.4.6
