<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon (AC-001-24): without it every production page load logs a /favicon.ico
  404 in the browser console. Next.js serves this file from `src/app` as the
  document icon, so no `<link>` tag is needed.

  The two paths are the fern of `src/components/brand/wordmark.tsx`. The literal
  hex values live here and nowhere else: an SVG asset served outside the document
  cannot read a CSS custom property, and the icon must stay legible on whatever
  colour the browser puts behind a tab. They are the computed sRGB of the §1.1
  tokens --primary (deep teal) and --primary-foreground (cool near-white).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="32" height="32">
  <rect width="20" height="20" rx="5.4" fill="#0d7489" />
  <g fill="none" stroke="#fbfcfd" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 16.6V8.4c0-2.9 1.9-5 4.7-5.5.1 3.9-1.7 6.6-4.7 7.5" />
    <path d="M10 13.1c-2.5-.7-4.1-2.9-4.5-6.3 2.6.8 4.1 2.7 4.5 5" />
  </g>
</svg>
